{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto p-6 bg-gray-900 text-white min-h-screen">
    <h2 class="text-xl font-bold mb-4">Confirm Deletion</h2>
    <p>Are you sure you want to delete <strong>{{ diamond.name }}</strong>?</p>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white">Yes, Delete</button>
        <a href="{% url 'diamond_list' %}" class="ml-4 text-gray-300 hover:underline">Cancel</a>
    </form>
</div>
{% endblock %}
