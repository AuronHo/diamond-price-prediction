{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gray-950 py-20 flex items-center justify-center">
    <div class="max-w-2xl w-full p-6 bg-gray-900 text-white shadow-2xl rounded-lg">
        <h2 class="text-2xl font-bold mb-6 text-center">{{ title }}</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                    <div>
                        <label class="block mb-1 font-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-400 text-sm">{{ field.errors|striptags }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
           <div class="mt-6 flex justify-center gap-4">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded text-white">Save</button>
                <a href="{% url 'diamond_list' %}" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded text-white">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
