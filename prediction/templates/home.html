{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TokoBerlian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ultimate Shine + Pulse */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 30px 30px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .sparkling-diamond {
            position: relative;
            overflow: hidden;
            animation: pulse 3s infinite;
            border-radius: 1rem;
        }

        .sparkling-diamond::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 70%);
            animation: shine 3s infinite linear;
        }
    </style>
</head>
<body class="bg-black text-gray-200">

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-6 bg-gray-900 shadow-md">
        <div class="text-2xl font-bold text-white">
            TokoBerlian
        </div>
        <div>
            <a href="/" class="text-gray-300 mx-4 hover:text-white hover:underline">Home</a>
            <a href="/predict" class="text-gray-300 mx-4 hover:text-white hover:underline">Predict Price</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="flex flex-col items-center justify-center text-center py-20">
        <div class="sparkling-diamond w-[1000px] h-[500px] mx-auto mb-10">
            <img src="{% static 'prediction/images/diamond.jpg' %}" alt="Diamond Logo" class="w-full h-full object-cover rounded-lg shadow-2xl filter brightness-200">
        </div>
        <h1 class="text-5xl font-extrabold mb-6 text-white">Shine Bright in the Darkness</h1>
        <p class="text-gray-400 max-w-2xl mb-8">
            Discover the true worth of your diamond instantly using cutting-edge AI prediction.
        </p>

        <!-- Call To Action Button -->
        <a href="/predict" class="px-8 py-4 bg-gray-200 hover:bg-gray-100 text-black text-lg font-bold rounded-full transition duration-300 shadow-lg hover:shadow-2xl transform hover:scale-105">
            Predict Now
        </a>        
    </section>

</body>
</html>
