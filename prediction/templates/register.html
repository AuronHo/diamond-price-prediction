{% extends 'base.html' %}

{% load humanize %}

{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
    <!-- From Uiverse.io by JohnnyCSilva --> 
    <div class="bg-black min-h-screen flex items-center justify-center pt-16 pb-16">
        <form class="form" method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="flex-column">
                <label>Username</label>
            </div>
            <div class="inputForm">
                <input placeholder="Enter your Username" class="input" type="text" name="username" required>
            </div>

            <div class="flex-column">
                <label>Email</label>
            </div>
            <div class="inputForm">
                <input placeholder="Enter your Email" class="input" type="email" name="email" required>
            </div>

            <div class="flex-column">
                <label>Password</label>
            </div>
            <div class="inputForm">
                <input placeholder="Enter your Password" class="input" type="password" name="password" required>
            </div>

            <button class="button-submit">Sign Up</button>

            <p class="p">Already have an account? <a href="{% url 'login' %}"><span class="span hover:underline">Sign In</span></a></p>
        </form>
    </div>
{% endblock %}
